<div class="container">
  <h2>{{ isEdicao ? 'Editar' : 'Nova' }} Operadora</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Nome</mat-label>
      <input matInput formControlName="nome" placeholder="Nome da operadora">
      <mat-error *ngIf="form.get('nome')?.errors?.['required']">
        Nome é obrigatório
      </mat-error>
      <mat-error *ngIf="form.get('nome')?.errors?.['minlength']">
        Nome deve ter no mínimo 3 caracteres
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Tipo de Serviço</mat-label>
      <mat-select formControlName="tipoServico">
        <mat-option *ngFor="let tipo of tiposServico" [value]="tipo">
          {{ tipo }}
        </mat-option>
      </mat-select>
      <mat-error *ngIf="form.get('tipoServico')?.errors?.['required']">
        Tipo de serviço é obrigatório
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Contato Suporte</mat-label>
      <input matInput formControlName="contatoSuporte" placeholder="Telefone de suporte">
      <mat-error *ngIf="form.get('contatoSuporte')?.errors?.['required']">
        Contato de suporte é obrigatório
      </mat-error>
      <mat-error *ngIf="form.get('contatoSuporte')?.errors?.['pattern']">
        Contato deve ter entre 10 e 11 dígitos
      </mat-error>
    </mat-form-field>

    <div class="buttons-container">
      <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">Salvar</button>
      <button mat-button type="button" (click)="cancelar()">Cancelar</button>
    </div>
  </form>
</div>
