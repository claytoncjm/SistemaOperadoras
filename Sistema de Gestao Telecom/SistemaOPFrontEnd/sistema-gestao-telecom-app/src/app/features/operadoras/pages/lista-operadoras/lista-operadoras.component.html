<div class="container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Operadoras</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <div class="actions-row">
        <mat-form-field appearance="outline">
          <mat-label>Filtrar</mat-label>
          <input matInput (keyup)="aplicarFiltro($event)" placeholder="Ex. Vivo" #input>
        </mat-form-field>

        <button mat-raised-button color="primary" (click)="novaOperadora()">
          <mat-icon>add</mat-icon>
          Nova Operadora
        </button>
      </div>

      <div class="mat-elevation-z8">
        <table mat-table [dataSource]="dataSource" matSort>
          <!-- ID Column -->
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
            <td mat-cell *matCellDef="let row"> {{row.id}} </td>
          </ng-container>

          <!-- Nome Column -->
          <ng-container matColumnDef="nome">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Nome </th>
            <td mat-cell *matCellDef="let row"> {{row.nome}} </td>
          </ng-container>

          <!-- Tipo Serviço Column -->
          <ng-container matColumnDef="tipoServico">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Tipo de Serviço </th>
            <td mat-cell *matCellDef="let row"> {{row.tipoServico}} </td>
          </ng-container>

          <!-- Contato Suporte Column -->
          <ng-container matColumnDef="contatoSuporte">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Contato Suporte </th>
            <td mat-cell *matCellDef="let row"> {{row.contatoSuporte}} </td>
          </ng-container>

          <!-- Ações Column -->
          <ng-container matColumnDef="acoes">
            <th mat-header-cell *matHeaderCellDef> Ações </th>
            <td mat-cell *matCellDef="let row">
              <button mat-icon-button color="primary" (click)="editarOperadora(row.id)">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" (click)="excluirOperadora(row.id)">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

          <!-- Row shown when there is no matching data. -->
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" colspan="5">Nenhum dado corresponde ao filtro "{{input.value}}"</td>
          </tr>
        </table>

        <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Selecione a página"></mat-paginator>
      </div>
    </mat-card-content>
  </mat-card>
</div>
