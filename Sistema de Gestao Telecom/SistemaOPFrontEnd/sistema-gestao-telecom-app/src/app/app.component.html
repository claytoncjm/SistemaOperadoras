<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #drawer class="sidenav" fixedInViewport
    [attr.role]="(isHandset$ | async) ? 'dialog' : 'navigation'"
    [mode]="(isHandset$ | async) ? 'over' : 'side'"
    [opened]="(isHandset$ | async) === false">
    <mat-toolbar>Menu</mat-toolbar>
    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>
      <a mat-list-item routerLink="/operadoras" routerLinkActive="active">
        <mat-icon matListItemIcon>business</mat-icon>
        <span matListItemTitle>Operadoras</span>
      </a>
      <a mat-list-item routerLink="/contratos" routerLinkActive="active">
        <mat-icon matListItemIcon>description</mat-icon>
        <span matListItemTitle>Contratos</span>
      </a>
      <a mat-list-item routerLink="/faturas" routerLinkActive="active">
        <mat-icon matListItemIcon>receipt</mat-icon>
        <span matListItemTitle>Faturas</span>
      </a>
      <a mat-list-item routerLink="/relatorios/custos" routerLinkActive="active">
        <mat-icon matListItemIcon>assessment</mat-icon>
        <span matListItemTitle>Relatórios</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <button
        type="button"
        aria-label="Toggle sidenav"
        mat-icon-button
        (click)="drawer.toggle()"
        *ngIf="isHandset$ | async">
        <mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
      </button>
      <span>Sistema de Gestão de Telecom</span>
      <span class="spacer"></span>
      <button mat-icon-button [matMenuTriggerFor]="notificacoesMenu" class="notificacoes-btn">
        <mat-icon [matBadge]="notificacoesNaoLidas$ | async" [matBadgeHidden]="(notificacoesNaoLidas$ | async) === 0" matBadgeColor="warn">notifications</mat-icon>
      </button>
      <mat-menu #notificacoesMenu="matMenu" class="notificacoes-menu" xPosition="before">
        <app-notificacoes></app-notificacoes>
      </mat-menu>
    </mat-toolbar>
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
